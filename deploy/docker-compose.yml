# Déploiement d'un environnement (dev ou prod) sur le serveur.
# Usage : ./redeploy.sh dev|prod [tag]   (lit .env.<env> pour les ports, tags et config runtime)
name: us-mecanic-${APP_ENV_NAME:?APP_ENV_NAME manquant}

services:
  web:
    image: alexandredelesse/us-mecanic:${IMAGE_TAG:?IMAGE_TAG manquant}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:?WEB_PORT manquant}:80"
    environment:
      APP_ENV_NAME: ${APP_ENV_NAME}
      APP_API_URL: ${APP_API_URL:-}
      APP_LEGACY_API_URL: ${APP_LEGACY_API_URL:-}
      APP_GEOLOC_API_URL: ${APP_GEOLOC_API_URL:-}
      APP_MAP_STYLE_URL: ${APP_MAP_STYLE_URL:-}
      APP_KEYCLOAK_URL: ${APP_KEYCLOAK_URL:-}
      APP_KEYCLOAK_REALM: ${APP_KEYCLOAK_REALM:-}
      APP_KEYCLOAK_CLIENT_ID: ${APP_KEYCLOAK_CLIENT_ID:-}
      APP_AUTH_DISABLED: ${APP_AUTH_DISABLED:-}

  api:
    image: alexandredelesse/us-mecanic-api:${IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:?API_PORT manquant}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      Auth__Authority: ${API_AUTH_AUTHORITY:-}
      Auth__Audience: ${API_AUTH_AUDIENCE:-}
      Auth__Disabled: ${API_AUTH_DISABLED:-}
      Cors__AllowedOrigins__0: ${API_CORS_ORIGIN:-}
      # Les migrations sont appliquées au démarrage de l'API (Database__MigrateOnStartup)
      ConnectionStrings__Default: Host=db;Port=5432;Database=us_mecanic;Username=us_mecanic;Password=${DB_PASSWORD:?DB_PASSWORD manquant}

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: us_mecanic
      POSTGRES_USER: us_mecanic
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U us_mecanic -d us_mecanic"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
